<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm danh mục - Tech Store</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Tái sử dụng style form sẵn có -->
    <link rel="stylesheet" href="../css/product-add.css">
    <link rel="stylesheet" href="../css/logo.css">
</head>
<body>

    <symbol xmlns="http://www.w3.org/2000/svg" id="user" viewBox="0 0 16 16">

    </symbol>
    <symbol xmlns="http://www.w3.org/2000/svg" id="cart" viewBox="0 0 16 16">
        <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
    </symbol>
    <symbol xmlns="http://www.w3.org/2000/svg" id="navbar-icon" viewBox="0 0 16 16">
        <path d="M14 10.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0 0 1h3a.5.5 0 0 0 .5-.5zm0-3a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0 0 1h7a.5.5 0 0 0 .5-.5zm0-3a.5.5 0 0 0-.5-.5h-11a.5.5 0 0 0 0 1h11a.5.5 0 0 0 .5-.5z" />
    </symbol>
</svg>

<header id="header" class="site-header header-scrolled position-fixed text-black bg-light">
    <nav id="header-nav" class="navbar navbar-expand-lg px-3 mb-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="../images/main-logo.png" class="logo" alt="Tech Store">
            </a>
            <button class="navbar-toggler d-flex d-lg-none order-3 p-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#bdNavbar">
                <svg class="navbar-icon"><use xlink:href="#navbar-icon"></use></svg>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="bdNavbar">
                <div class="offcanvas-header px-4 pb-0">
                    <a class="navbar-brand" href="index.html">
                        <img src="../images/main-logo.png" class="logo" alt="Tech Store">
                    </a>
                    <button type="button" class="btn-close btn-close-black" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body">
                    <ul id="navbar" class="navbar-nav text-uppercase justify-content-end align-items-center flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link me-4" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-4" href="product-list.html">Products</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-4" href="order-list.html">My Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-4" href="create-order.html">Create Order</a>
                        </li>
                        <li class="nav-item">
                            <div class="user-items ps-5">
                                <ul class="d-flex justify-content-end list-unstyled">
                                    <li class="pe-3">
                                        <a href="login.html" id="userInfo">
                                            <svg class="user"><use xlink:href="#user"></use></svg>
                                        </a>
                                    </li>
                                    <li>
                                        <a href="create-order.html">
                                            <svg class="cart"><use xlink:href="#cart"></use></svg>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>

<section class="padding-large" style="padding-top: 150px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="display-header pb-3 mb-4">
                    <h2 class="display-7 text-dark text-uppercase">Thêm danh mục mới</h2>
                </div>

                <form id="categoryForm" class="product-form">
                    <div class="form-section">
                        <h5 class="section-title text-uppercase">Thông tin danh mục</h5>

                        <div class="mb-4">
                            <label for="categoryName" class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="categoryName" name="name" required>
                        </div>

                        <div class="mb-4">
                            <label for="categoryDescription" class="form-label">Mô tả</label>
                            <textarea class="form-control" id="categoryDescription" name="description" rows="4" placeholder="Mô tả ngắn về danh mục"></textarea>
                        </div>
                    </div>

                    <div class="form-actions d-flex gap-2 flex-wrap">
                        <button type="submit" class="btn btn-dark btn-medium text-uppercase" id="btnSubmit">
                            Thêm danh mục
                        </button>
                        <button
                                type="button"
                                class="btn btn-outline-secondary btn-medium text-uppercase"
                                id="btnViewCategories"
                                data-bs-toggle="modal"
                                data-bs-target="#categoryModal"
                        >
                            Xem danh mục đã tạo
                        </button>
                        <a href="product-list.html" class="btn btn-outline-dark btn-medium text-uppercase">
                            Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Modal danh sách danh mục -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-uppercase" id="categoryModalLabel">Danh sách danh mục</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body">
                <div id="categoryListLoading" class="text-center py-3" style="display:none;">Đang tải...</div>
                <div id="categoryListEmpty" class="text-center text-muted py-3" style="display:none;">Chưa có danh mục nào.</div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="categoryTable" style="display:none;">
                        <thead class="table-light">
                        <tr>
                            <th style="width: 20%;">ID</th>
                            <th style="width: 30%;">Tên danh mục</th>
                            <th style="width: 35%;">Mô tả</th>
                            <th style="width: 15%;" class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="categoryTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>

<!-- ... footer giữ nguyên ... -->

<!-- Script: jQuery, Bootstrap, API_BASE_URL và file JS xử lý -->
<script src="../js/jquery-1.11.0.min.js"></script>
<script src="../js/bootstrap.bundle.min.js"></script>

<!-- Khai báo BASE_URL nếu trang này chưa có biến đó -->
<script>
    window.API_BASE_URL = window.API_BASE_URL || 'http://localhost:8080/api';
</script>

<script src="../js/category-add.js"></script>
</body>
</html>
