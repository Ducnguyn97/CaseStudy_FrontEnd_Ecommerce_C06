<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm | MiniStore</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        body { font-family: 'Lato', sans-serif; background-color: #f4f7f9; margin:0; }
        .container { display: flex; height: 100vh; }
        .sidebar { width: 220px; background: #343a40; color: #fff; padding: 20px; flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar h4 { color: #fff; font-size: 1.4rem; margin-bottom: 20px; }
        .sidebar button { display: block; width: 100%; margin-bottom: 10px; background: #495057; color: #fff; border: none; padding: 12px; border-radius: 5px; text-align: left; }
        .sidebar button:hover { background: #6c757d; cursor: pointer; }
        #btnLogout { background: #dc3545 !important; margin-top: auto; }
        .content { flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff !important; color: white; }
        .btn-sm { font-size: 0.8rem; padding: 5px 10px; margin-right: 5px; }
        .form-inline input, .form-inline button { margin-right: 5px; margin-bottom: 5px; }
        .form-inline input { padding: 5px 8px; border-radius: 5px; border: 1px solid #ccc; }
        .form-inline button { padding: 5px 12px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
        <h4>QUẢN LÝ BÁN HÀNG</h4>
        <button id="btnUsers">Người Dùng</button>
        <button id="btnProducts">Sản Phẩm</button>
        <hr style="border-color: #6c757d;">
        <button id="btnLogout">Đăng Xuất</button>
    </div>

    <!-- Content -->
    <div class="content">
        <div id="contentArea"></div>
    </div>
</div>

<!-- Bootstrap + jQuery -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function(){
        const API_BASE = "http://localhost:8080/api";
        const token = localStorage.getItem("token");
        const currentUserRole = localStorage.getItem("role");
        const contentArea = $("#contentArea");

        if(!token){
            contentArea.html('<h4 class="text-danger">Bạn chưa đăng nhập. Vui lòng click vào <a href="login.html" class="text-primary text-decoration-underline">đăng nhập</a> để truy cập Login.</h4>');
            return;
        }

        function getAuthHeader() { return { "Authorization": `Bearer ${token}` }; }

        // Logout
        $("#btnLogout").click(function() {
            if(confirm("Bạn có chắc muốn đăng xuất?")) {
                localStorage.clear();
                window.location.href = "login.html";
            }
        });

        // Navigation
        // $("#btnUsers").click(()=> window.location.href = "manager.html.html");
        $("#btnUsers").click(() => {
            window.location.href = "manager.html";//về trang manager
        });
        // Pagination
        let productPage = 0;
        let productSize = 5;

        function loadProducts(search="") {
            contentArea.html("<h4>Loading products...</h4>");
            $.ajax({
                url: `${API_BASE}/products?page=${productPage}&size=${productSize}&search=${search}`,
                type: "GET",
                headers: getAuthHeader(),
                success: function(data){
                    const products = Array.isArray(data) ? data : [];
                    let html = `
                <div class="top-bar">
                    <h4>Danh sách sản phẩm</h4>
                    <button class="btn btn-success btn-sm" id="btnAddProduct">+ Thêm sản phẩm</button>
                </div>
                <div class="form-inline mb-2">
                    <input type="text" id="searchProduct" placeholder="Tìm kiếm sản phẩm">
                    <button id="btnSearchProduct" class="btn btn-primary btn-sm">Tìm</button>
                </div>

                <table class="table">
                    <thead>
                        <tr><th>ID</th><th>Tên</th><th>Giá</th><th>Kho</th><th>Danh mục</th><th>Ảnh</th><th>Hành động</th></tr>
                    </thead>
                    <tbody>`;
                    products.forEach(p=>{
                        html += `<tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.price.toLocaleString()}₫</td>
                        <td>${p.stock}</td>
                        <td>${p.category ? p.category.name : '-'}</td>
                        <td><img src="${p.imageUrl || 'img/no-image.png'}" width="60"></td>
                        <td>`;
                        if(currentUserRole==="ROLE_ADMIN"){
                            html += `<button class="btn btn-warning btn-sm" onclick="editProduct(${p.id})">Sửa</button>
                                 <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">Xóa</button>`;
                        }
                        html += `</td></tr>`;
                    });
                    html += `</tbody></table>
                <div class="mb-3">
                    <button id="prevProd" class="btn btn-secondary btn-sm">Prev</button>
                    <button id="nextProd" class="btn btn-secondary btn-sm">Next</button>
                </div>`;
                    contentArea.html(html);

                    // Events
                    $("#btnSearchProduct").click(()=> { productPage=0; loadProducts($("#searchProduct").val().trim()); });
                    $("#prevProd").click(()=>{ if(productPage>0){ productPage--; loadProducts($("#searchProduct").val().trim()); }});
                    $("#nextProd").click(()=>{ if(data.totalPages && productPage < data.totalPages-1){ productPage++; loadProducts($("#searchProduct").val().trim()); }});

                    $("#btnAddProduct").click(() => {
                        window.location.href = "index/product-add.html";
                    });
                },
                error: function(xhr){ alert("Lỗi tải sản phẩm: "+xhr.responseText); }
            });
        }

        // Delete product
        window.deleteProduct = function(id){
            if(confirm("Bạn có chắc muốn xóa sản phẩm này?")) {
                $.ajax({
                    url:`${API_BASE}/products/${id}`,
                    type:"DELETE",
                    headers:getAuthHeader(),
                    success:function(){ alert("Đã xóa!"); loadProducts(); },
                    error:function(xhr){ alert(xhr.responseText); }
                });
            }
        };

        // Edit product
        window.editProduct = function(id){
            $.ajax({
                url:`${API_BASE}/products/${id}`,
                type:"GET",
                headers:getAuthHeader(),
                success:function(p){
                    $("#editProductId").val(p.id);
                    $("#editProductName").val(p.name);
                    $("#editProductPrice").val(p.price);
                    $("#editProductStock").val(p.stock);
                    $("#editProductImage").val(p.imageUrl);
                    $("#editProductModal").modal("show");
                },
                error:function(xhr){ alert(xhr.responseText); }
            });
        };

        // Add / Update product
        $("#saveProductBtn").click(function(){
            const newProd = {
                name: $("#addProductName").val(),
                price: $("#addProductPrice").val(),
                stock: $("#addProductStock").val(),
                imageUrl: $("#addProductImage").val()
            };
            $.ajax({
                url:`${API_BASE}/products`,
                type:"POST",
                headers:getAuthHeader(),
                contentType:"application/json",
                data: JSON.stringify(newProd),
                success:function(){ alert("Thêm thành công!"); $("#addProductModal").modal("hide"); loadProducts(); },
                error:function(xhr){ alert(xhr.responseText); }
            });
        });

        $("#updateProductBtn").click(function(){
            const prod = {
                id: $("#editProductId").val(),
                name: $("#editProductName").val(),
                price: $("#editProductPrice").val(),
                stock: $("#editProductStock").val(),
                imageUrl: $("#editProductImage").val()
            };
            $.ajax({
                url:`${API_BASE}/products/${prod.id}`,
                type:"PUT",
                headers:getAuthHeader(),
                contentType:"application/json",
                data: JSON.stringify(prod),
                success:function(){ alert("Cập nhật thành công!"); $("#editProductModal").modal("hide"); loadProducts(); },
                error:function(xhr){ alert(xhr.responseText); }
            });
        });

        loadProducts();
    });
</script>

<!-- Modal Thêm sản phẩm -->
<div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Thêm sản phẩm</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <label>Tên sản phẩm</label><input id="addProductName" class="form-control mb-2" required>
                <label>Giá</label><input id="addProductPrice" type="number" class="form-control mb-2" required>
                <label>Số lượng</label><input id="addProductStock" type="number" class="form-control mb-2" required>
                <label>URL Ảnh</label><input id="addProductImage" class="form-control mb-2">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button id="saveProductBtn" class="btn btn-primary">Lưu</button>
            </div>
        </div>
    </div>
</div>
